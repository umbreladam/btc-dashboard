version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: satoshi-btc-dashboard_web_1
      APP_PORT: 8080

  web:
    # Pin a version tag (and ideally @sha256 digest) so Umbrel updates are explicit.
    image: ghcr.io/umbreladam/btc-dashboard:1.0.0@sha256:b803b5b55d4470c2397154c2eca5c9b8d0958c2573b8e61ac101d893916e617d
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      TZ: Europe/London
      # Exported by Umbrel's electrs app (electrs/exports.sh): 10.21.21.10:50001
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT
      LOAD_EXAMPLE_DATA: "1"
