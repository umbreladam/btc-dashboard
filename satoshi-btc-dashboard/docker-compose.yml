version: "3.7"

services:
  app_proxy:
    environment:
      # Format: <app-id>_<docker-service-name>_1
      APP_HOST: satoshi-btc-dashboard_web_1
      APP_PORT: 8080

  web:
    # Pin a version tag (and ideally @sha256 digest) so Umbrel updates are explicit.
    image: ghcr.io/umbreladam/btc-dashboard:1.0.2@sha256:622e7657b9739e8945f08935a105fcd731eb6db2ae69fea52ec63f08d2558e57
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      DATA_DIR: /data
      TZ: Europe/London
      # Exported by Umbrel's electrs app (electrs/exports.sh). The app is locked to this server unless the user
      # sets an explicit, confirmed override in Settings.
      APP_ELECTRS_NODE_IP: $APP_ELECTRS_NODE_IP
      APP_ELECTRS_NODE_PORT: $APP_ELECTRS_NODE_PORT
      LOAD_EXAMPLE_DATA: "1"
