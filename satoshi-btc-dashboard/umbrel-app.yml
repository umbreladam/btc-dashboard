manifestVersion: 1
id: satoshi-btc-dashboard
name: Satoshi BTC Dashboard
tagline: Private Bitcoin-only portfolio tracker with UK CGT
icon: https://raw.githubusercontent.com/umbreladam/umbrel-app-store/main/satoshi-btc-dashboard/icon.svg
category: bitcoin
version: "1.0.2"
port: 8765
description: >-
  A self-hosted, Bitcoin-only portfolio dashboard. Track BTC held on Strike, exchanges and
  cold storage, cost basis, unrealised profit and an estimate of what you would keep after UK
  Capital Gains Tax (HMRC same-day, 30-day and Section 104 pooling rules).


  Import Coinbase, Kraken and Strike CSV exports, record your daily Strike DCA automatically with
  a read-only API key, and watch your cold storage balance (single-sig xpub or multisig descriptor, watch-only) through your
  own Electrs server. Your xpub/descriptor never leaves your Umbrel.


  Not tax advice.
developer: umbreladam
website: https://github.com/umbreladam/btc-dashboard
submitter: umbreladam
submission: https://github.com/umbreladam/umbrel-app-store
repo: https://github.com/umbreladam/btc-dashboard
support: https://github.com/umbreladam/btc-dashboard/issues
gallery: []
releaseNotes: >-
  Wallets: every wallet now has a name, optional description and a Multisig / Single-sig label (auto-detected,
  e.g. 2-of-3, and editable). Rename, describe or relabel wallets without re-entering keys; keys are write-only after
  saving. New dashboard Wallets panel (Strike, each cold wallet, exchanges: BTC, GBP/USD, % of total, last scanned)
  and a holdings-by-wallet donut. Existing wallets are migrated automatically.

  Security: the app only accepts requests from Umbrel's app proxy (so other apps on your Umbrel can't bypass
  the Umbrel login), CSRF protection on all changes, Electrum locked to your Umbrel's Electrs (a custom server
  needs explicit confirmation; TLS certificates verified, self-signed fingerprint pinning), no key material in
  any API response, Strike key encrypted at rest, owner-only data files, API docs disabled, and an option to
  turn off external price lookups. Note: a custom Electrum host set in 1.0.1 is reset to Umbrel's Electrs.
dependencies:
  - electrs
path: ""
defaultUsername: ""
defaultPassword: ""
