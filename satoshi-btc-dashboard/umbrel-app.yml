manifestVersion: 1
id: satoshi-btc-dashboard
name: Satoshi BTC Dashboard
tagline: Private Bitcoin-only portfolio tracker with UK CGT
icon: https://raw.githubusercontent.com/umbreladam/umbrel-app-store/main/satoshi-btc-dashboard/icon.svg
category: bitcoin
version: "1.0.1"
port: 8765
description: >-
  A self-hosted, Bitcoin-only portfolio dashboard. Track BTC held on Strike, exchanges and
  cold storage, cost basis, unrealised profit and an estimate of what you would keep after UK
  Capital Gains Tax (HMRC same-day, 30-day and Section 104 pooling rules).


  Import Coinbase, Kraken and Strike CSV exports, record your daily Strike DCA automatically with
  a read-only API key, and watch your cold storage balance (single-sig xpub or multisig descriptor, watch-only) through your
  own Electrs server. Your xpub/descriptor never leaves your Umbrel.


  Not tax advice.
developer: umbreladam
website: https://github.com/umbreladam/btc-dashboard
submitter: umbreladam
submission: https://github.com/umbreladam/umbrel-app-store
repo: https://github.com/umbreladam/btc-dashboard
support: https://github.com/umbreladam/btc-dashboard/issues
gallery: []
releaseNotes: >-
  Multisig cold storage: paste an output descriptor (wsh/sh-wsh/sh sortedmulti or multi, key origins,
  /<0;1>/* multipath, checksum verified) or a Sparrow, Specter, Nunchuk, Caravan, Electrum or Coldcard
  export. Track several labelled cold wallets (e.g. multisig + single-sig). "Show first addresses" now
  shows receive and change addresses before saving so you can compare with your wallet. Still
  watch-only: no transactions or PSBTs; descriptors stay in /data and only script hashes go to your Electrs.
dependencies:
  - electrs
path: ""
defaultUsername: ""
defaultPassword: ""
